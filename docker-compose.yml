# Optional. Native install is recommended (GPU encoders/ComfyUI/Ollama are simpler on the host).
services:
  studio:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes: [".:/app"]
    ports: ["127.0.0.1:8000:8000"]
    environment: [DRIFTBOUND_WORKSPACE=/app/workspace, DRIFTBOUND_OLLAMA_URL=http://host.docker.internal:11434]
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null && pip install -q -e . &&
             (python -m app.workers.worker &) && uvicorn app.main:app --host 0.0.0.0 --port 8000"
