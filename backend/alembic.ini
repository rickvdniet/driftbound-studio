[alembic]
prepend_sys_path = .
path_separator = os
script_location = %(here)s/migrations
sqlalchemy.url = sqlite:///%(here)s/../workspace/driftbound.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(message)s
