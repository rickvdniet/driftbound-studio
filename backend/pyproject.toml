[project]
name = "driftbound-studio"
version = "0.1.0"
description = "Free-first local production platform for original long-form ambient YouTube videos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "pydantic>=2.7",
  "pydantic-settings>=2.3", "numpy>=1.26", "scipy>=1.13", "pillow>=10.3", "opencv-python-headless>=4.9",
  "httpx>=0.27", "python-multipart>=0.0.9", "psutil>=5.9",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.130", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running rendering tests (deselect with -m 'not slow')"]
